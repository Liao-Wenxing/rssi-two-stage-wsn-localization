[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cml-wls-wsn"
version = "1.0.0"
description = "Censoring-aware uncertainty-weighted RSSI localization for static wireless sensor networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["localization_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
